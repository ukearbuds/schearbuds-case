<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무선이어폰 배터리</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--card:#fff;--ink:#16202a;--sub:#6b7885;--track:#dde3e9;--green:#1fa463;--red:#e5393b;--shell:#f7f8fa;--shade:#cfd6dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151a;--card:#1a222a;--ink:#eef2f6;--sub:#93a1ae;--track:#2c3742;--shell:#e9edf1;--shade:#aab4be}}
:root[data-theme="dark"]{--bg:#10151a;--card:#1a222a;--ink:#eef2f6;--sub:#93a1ae;--track:#2c3742;--shell:#e9edf1;--shade:#aab4be}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{width:min(92vw,380px);background:var(--card);border-radius:28px;padding:28px 24px 32px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
h1{font-size:1.05rem;font-weight:600;margin:0 0 4px;color:var(--sub)}
svg{display:block;width:100%;height:auto;margin:8px 0 12px}
.pct{font-size:4rem;font-weight:700;line-height:1;margin:0;font-variant-numeric:tabular-nums;color:var(--c)}
.state{margin:6px 0 20px;color:var(--sub);font-size:.95rem;min-height:1.4em}
.bar{position:relative;height:18px;border-radius:9px;background:var(--track);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--c);border-radius:9px;transition:width .15s,background .2s}
input[type=range]{width:100%;margin:14px 0 0;accent-color:var(--c)}
.lid-back{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:lidBack .55s cubic-bezier(.3,1.4,.5,1) 1s forwards}
.lid-front{transform-box:fill-box;transform-origin:50% 0;animation:lidFront .6s ease-in .5s forwards}
.buds{opacity:0;animation:buds .5s ease-out 1.4s forwards}
@keyframes lidBack{to{transform:scaleY(1)}}
@keyframes lidFront{70%{opacity:1}to{transform:scaleY(0);opacity:0}}
@keyframes buds{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lid-back{animation:none;transform:none}.lid-front{display:none}.buds{animation:none;opacity:1}}
</style>
</head>
<body>
<main style="--p:80%;--c:var(--green)" id="app">
  <h1>이어폰 케이스 배터리</h1>
  <svg viewBox="0 0 320 180" role="img" aria-label="이어폰이 들어 있는 충전 케이스">
    <rect class="lid-back" x="62" y="8" width="196" height="74" rx="32" fill="var(--shade)"/>
    <rect x="40" y="70" width="240" height="100" rx="40" fill="var(--shell)" stroke="var(--shade)" stroke-width="2"/>
    <ellipse cx="160" cy="86" rx="102" ry="17" fill="#3a434c"/>
    <g class="buds" fill="#fff" stroke="#c3cbd3" stroke-width="2">
      <rect x="121" y="76" width="10" height="26" rx="5"/>
      <ellipse cx="120" cy="62" rx="21" ry="25"/>
      <rect x="189" y="76" width="10" height="26" rx="5"/>
      <ellipse cx="200" cy="62" rx="21" ry="25"/>
    </g>
    <circle cx="160" cy="144" r="6" fill="var(--c)"/>
    <path class="lid-front" d="M40 114 V110 A40 40 0 0 1 80 70 H240 A40 40 0 0 1 280 110 V114 Z" fill="var(--shell)" stroke="var(--shade)" stroke-width="2"/>
  </svg>
  <p class="pct"><span id="v">80</span>%</p>
  <p class="state" id="s">배터리 충분</p>
  <div class="bar"><div class="fill"></div></div>
  <input type="range" id="r" min="0" max="100" value="80" aria-label="배터리 잔량">
</main>
<script>
(function(){
  var app=document.getElementById('app'),r=document.getElementById('r'),v=document.getElementById('v'),s=document.getElementById('s');
  function set(n){
    n=Math.max(0,Math.min(100,Math.round(n)));
    var low=n<=20;
    app.style.setProperty('--p',n+'%');
    app.style.setProperty('--c',low?'var(--red)':'var(--green)');
    v.textContent=n;r.value=n;
    s.textContent=low?'배터리 부족, 충전이 필요해요':'배터리 충분';
  }
  r.addEventListener('input',function(){set(+r.value)});
  var q=new URLSearchParams(location.search).get('b');
  set(q!==null&&!isNaN(+q)?+q:80);
})();
</script>
</body>
</html>
